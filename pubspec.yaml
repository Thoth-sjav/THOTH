name: thoth_app
description: "Aplicação de estudo com técnica Pomodoro e gamificação."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # UI
  cupertino_icons: ^1.0.6
  google_sign_in: ^6.2.1
  image_picker: ^1.0.4
  share_plus: ^7.2.0
  path_provider: ^2.1.1

  # Notificações
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2

  # Audio
  audioplayers: ^5.2.0

  # Desktop
  window_manager: ^0.3.8

  # State Management & DI
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  provider: ^6.0.0

  # Logging
  logger: ^2.0.1

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^5.0.0

  # Persistência Local
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.0
  
  # Code generation
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
