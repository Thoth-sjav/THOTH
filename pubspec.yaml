name: thoth_app
description: "Aplicação de estudo com técnica Pomodoro e gamificação."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  google_sign_in: ^6.2.1

  cupertino_icons: ^1.0.6
  image_picker: ^1.0.4
  share_plus: ^7.2.0
  path_provider: ^2.1.1

  audioplayers: ^5.2.0

  window_manager: ^0.3.8

  flutter_riverpod: ^2.5.1
  provider: ^6.1.2

  logger: ^2.0.1

  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
