  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2

  # Audio
  audioplayers: ^5.2.0

  # Desktop
  window_manager: ^0.3.8

  # State Management
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2
  riverpod: ^2.5.1

  # Logging
  logger: ^2.0.1

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.2

