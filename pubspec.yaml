name: thoth_app
description: "Aplicação de estudo com técnica Pomodoro e gamificação."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (VERSÕES COMPATÍVEIS E ESTÁVEIS)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # Google Sign-In (Pigeon compatível)
  google_sign_in: ^6.2.1

