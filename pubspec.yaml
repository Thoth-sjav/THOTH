name: thoth_final_final
description: Thoth Study Helper - Estude com inteligência, alcance seus objetivos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.4.4

  # Autenticação Google
  google_sign_in: ^6.2.1

  # Seleção de Imagens
  image_picker: ^1.1.2

  # Partilha
  share_plus: ^10.1.4

  # Gestão de diretórios
  path_provider: ^2.1.5

  # Notificações locais
  flutter_local_notifications: ^18.0.1

  # Timezone para agendar notificações
  timezone: ^0.9.4

  # Som do timer
  audioplayers: ^6.1.0

  # Controlar janela desktop
  window_manager: ^0.3.7

  # Persistência local
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/timer_fim.wav
    - assets/sounds/timer_fase.wav
