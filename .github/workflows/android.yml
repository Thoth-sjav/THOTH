name: Build Flutter APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo "========== SHA-1 DO KEYSTORE =========="
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep "SHA1:"
          echo "========================================"

      - name: Configure signing in build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.thoth.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.thoth.app"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
          }
          GRADLE

      - name: Flutter Version
        run: flutter --version

      - name: Clean Project
        run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Print SHA-1 of compiled APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "========== SHA-1 DO APK COMPILADO =========="
          keytool -printcert -jarfile $APK | grep "SHA1:"
          echo "============================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
