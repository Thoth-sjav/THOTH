name: Build Flutter APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /home/runner/thoth-release.jks
          echo "========== SHA-1 DO KEYSTORE =========="
          keytool -list -v \
            -keystore /home/runner/thoth-release.jks \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep "SHA1:"
          echo "========================================"

      - name: Flutter Version
        run: flutter --version

      - name: Clean Project
        run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=KEYSTORE_PATH=/home/runner/thoth-release.jks
        env:
          KEYSTORE_PATH: /home/runner/thoth-release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android

      - name: Sign APK manually
        run: |
          APK_UNSIGNED=build/app/outputs/flutter-apk/app-release.apk
          APK_SIGNED=build/app/outputs/flutter-apk/app-release-signed.apk

          # Remove old signature
          cp $APK_UNSIGNED $APK_SIGNED

          # Sign with our keystore
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore /home/runner/thoth-release.jks \
            -storepass android \
            -keypass android \
            $APK_SIGNED androiddebugkey

          echo "========== SHA-1 DO APK ASSINADO =========="
          keytool -printcert -jarfile $APK_SIGNED | grep "SHA1:"
          echo "============================================"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release-signed.apk
